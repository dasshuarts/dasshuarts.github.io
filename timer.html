<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adoptable Auction Timer — DASShu</title>
<style>
  :root {
    --bg-milk: #FAF8F5; --bg-card: #FFFFFF; --bg-oat: #F2ECE4;
    --wood-main: #9C7E63; --vgen-lime: #B4F000; --vgen-text: #142400;
    --sage-green: #5B8C6E; --sage-bg: #EBF3ED;
    --text-main: #2C2825; --text-sub: #857D75; --border-soft: #E8E1D9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-milk); color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Noto Sans Thai", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }

  .timer-card {
    background: var(--bg-card); border: 1px solid var(--border-soft);
    border-radius: 24px; padding: 44px 36px; max-width: 780px; width: 100%;
    text-align: center; box-shadow: 0 10px 36px rgba(156, 126, 99, 0.08);
    position: relative;
  }

  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--sage-bg); color: var(--sage-green);
    border: 1px solid #D2E5D8; padding: 5px 16px; border-radius: 999px;
    font-size: 0.82rem; font-weight: 800; letter-spacing: 0.03em;
    margin-bottom: 24px;
  }
  .status-pill.ended {
    background: #FDECEB; color: #D9381E; border-color: #F7D4CF;
  }
  .status-pill.cancelled {
    background: var(--bg-oat); color: var(--text-sub); border-color: var(--border-soft);
  }

  .countdown-grid {
    display: flex; align-items: flex-end; justify-content: center;
    gap: 12px; margin-bottom: 28px; flex-wrap: wrap;
  }
  .time-unit {
    display: flex; flex-direction: column; align-items: center;
    background: var(--bg-milk); border: 1.5px solid var(--border-soft);
    border-radius: 18px; padding: 18px 24px; min-width: 145px;
  }
  .unit-label {
    font-size: 0.78rem; font-weight: 700; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px;
  }
  .unit-digits {
    font-size: 4.2rem; font-weight: 900; line-height: 1;
    font-variant-numeric: tabular-nums; color: var(--text-main);
  }
  .colon {
    font-size: 3.4rem; font-weight: 900; color: var(--wood-main);
    padding-bottom: 18px; user-select: none;
  }

  .adopt-title {
    font-size: 2rem; font-weight: 800; color: var(--text-main);
    margin-bottom: 22px; line-height: 1.25;
  }

  .schedule-bar {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    background: var(--bg-milk); border: 1px solid var(--border-soft);
    border-radius: 16px; padding: 18px; margin-bottom: 14px;
  }
  .sched-item {
    display: flex; flex-direction: column; gap: 4px;
  }
  .sched-item + .sched-item {
    border-left: 1px solid var(--border-soft); padding-left: 12px;
  }
  .sched-label {
    font-size: 0.76rem; font-weight: 700; color: var(--text-sub);
    text-transform: uppercase;
  }
  .sched-val {
    font-size: 0.95rem; font-weight: 800; color: var(--text-main);
  }

  .tz-note {
    font-size: 0.8rem; color: var(--text-sub); margin-bottom: 22px;
  }

  .action-row {
    display: flex; justify-content: center; padding-top: 18px;
    border-top: 1px solid var(--border-soft);
  }
  .btn-portfolio {
    background: var(--bg-oat); color: var(--text-main);
    border: 1px solid var(--border-soft); padding: 10px 22px;
    border-radius: 999px; font-size: 0.86rem; font-weight: 700;
    text-decoration: none; transition: 0.2s;
  }
  .btn-portfolio:hover { background: #EFE9E1; border-color: var(--wood-main); }

  @media (max-width: 640px) {
    .timer-card { padding: 30px 18px; }
    .time-unit { min-width: 92px; padding: 14px 12px; }
    .unit-digits { font-size: 2.5rem; }
    .colon { font-size: 2rem; padding-bottom: 12px; }
    .schedule-bar { grid-template-columns: 1fr; text-align: left; }
    .sched-item + .sched-item { border-left: none; border-top: 1px solid var(--border-soft); padding-left: 0; padding-top: 10px; }
  }
</style>
</head>
<body>

  <main class="timer-card">
    <div id="statusBadge" class="status-pill cancelled">⏳ LOADING TIMER...</div>

    <div class="countdown-grid">
      <div class="time-unit">
        <span class="unit-label">Hours / ชั่วโมง</span>
        <span class="unit-digits" id="hrVal">00</span>
      </div>
      <span class="colon">:</span>
      <div class="time-unit">
        <span class="unit-label">Minutes / นาที</span>
        <span class="unit-digits" id="minVal">00</span>
      </div>
      <span class="colon">:</span>
      <div class="time-unit">
        <span class="unit-label">Seconds / วินาที</span>
        <span class="unit-digits" id="secVal">00</span>
      </div>
    </div>

    <h1 class="adopt-title" id="adoptTitle">Adoptable Auction</h1>

    <div class="schedule-bar">
      <div class="sched-item">
        <span class="sched-label">🟢 Start / เวลาเริ่ม</span>
        <span class="sched-val" id="startVal">-</span>
      </div>
      <div class="sched-item">
        <span class="sched-label">⏳ Duration / ระยะเวลา</span>
        <span class="sched-val" id="durVal">-</span>
      </div>
      <div class="sched-item">
        <span class="sched-label">🔴 End / เวลาปิดประมูล</span>
        <span class="sched-val" id="endVal">-</span>
      </div>
    </div>

    <p class="tz-note" id="tzText">🌍 Times are automatically shown in your local timezone.</p>

    <div class="action-row">
      <a class="btn-portfolio" href="https://dasshuarts.github.io" target="_blank" rel="noopener">
        🎨 DASShu Portfolio ↗
      </a>
    </div>
  </main>

<script>
  const SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbxIbTJaE0XeRP9ZGgALqEjSlh_TcvNPSJ5weJfz5-_P0AkUF6V1bq3rNiDRm8NAmRTM/exec";
  const params = new URLSearchParams(window.location.search);
  const artId = params.get('id') || '';
  const rowNum = params.get('row') || '';

  let isAuctionActive = false;
  let startMs = 0;
  let endMs = 0;
  let durHours = '-';

  const userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local Time';
  document.getElementById('tzText').innerText =
    "🌍 Displayed in your local timezone (" + userTimeZone + ") • แสดงเวลาตามโซนเครื่องของคุณอัตโนมัติ";

  function formatLocalTime(ms) {
    if (!ms) return "-";
    const d = new Date(Number(ms));
    return d.toLocaleString('en-GB', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    }).replace(',', '');
  }

  // ซิงค์สถานะกับหลังบ้านแบบเรียลไทม์ทุกๆ 5 วินาที
  function syncTimerWithServer() {
    if (!artId && !rowNum) return;
    const oldScript = document.getElementById('timerSyncScript');
    if (oldScript) oldScript.remove();

    const script = document.createElement('script');
    script.id = 'timerSyncScript';
    script.src = SCRIPT_API_URL +
      "?action=getTimer&id=" + encodeURIComponent(artId) +
      "&row=" + encodeURIComponent(rowNum) +
      "&callback=onTimerSynced&t=" + Date.now();
    document.body.appendChild(script);
  }

  window.onTimerSynced = function(res) {
    const badge = document.getElementById('statusBadge');
    if (!res || !res.exists || !res.active || !res.timerData) {
      // เมื่อแอดมินกดหยุดเวลาหรือยกเลิกจากหลังบ้าน
      isAuctionActive = false;
      startMs = 0;
      endMs = 0;
      if (res && res.title) document.getElementById('adoptTitle').innerText = res.title;
      document.getElementById('hrVal').innerText = "00";
      document.getElementById('minVal').innerText = "00";
      document.getElementById('secVal').innerText = "00";
      document.getElementById('startVal').innerText = "-";
      document.getElementById('durVal').innerText = "-";
      document.getElementById('endVal').innerText = "-";
      badge.className = "status-pill cancelled";
      badge.innerText = "⚪ AUCTION CLOSED / หยุดหรือปิดการประมูลแล้ว";
      return;
    }

    isAuctionActive = true;
    startMs = Number(res.timerData.start || 0);
    endMs = Number(res.timerData.end || 0);
    durHours = res.timerData.durationHours || '-';

    document.getElementById('adoptTitle').innerText = res.title || 'Adoptable Character';
    document.getElementById('startVal').innerText = formatLocalTime(startMs);
    document.getElementById('durVal').innerText = durHours + ' Hours (' + durHours + ' ชม.)';
    document.getElementById('endVal').innerText = formatLocalTime(endMs);
    updateTick();
  };

  function updateTick() {
    if (!isAuctionActive || !endMs) return;
    const diff = endMs - Date.now();
    const badge = document.getElementById('statusBadge');

    if (diff <= 0) {
      document.getElementById('hrVal').innerText = "00";
      document.getElementById('minVal').innerText = "00";
      document.getElementById('secVal').innerText = "00";
      badge.className = "status-pill ended";
      badge.innerText = "🔴 AUCTION ENDED / ปิดประมูลแล้ว";
      return;
    }

    badge.className = "status-pill";
    badge.innerText = "🟢 AUCTION IN PROGRESS";

    const totalSec = Math.floor(diff / 1000);
    const hrs = Math.floor(totalSec / 3600);
    const mins = Math.floor((totalSec % 3600) / 60);
    const secs = totalSec % 60;

    document.getElementById('hrVal').innerText = String(hrs).padStart(2, '0');
    document.getElementById('minVal').innerText = String(mins).padStart(2, '0');
    document.getElementById('secVal').innerText = String(secs).padStart(2, '0');
  }

  syncTimerWithServer();
  setInterval(syncTimerWithServer, 5000);
  setInterval(updateTick, 1000);
</script>
</body>
</html>
